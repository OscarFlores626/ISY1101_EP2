# ============================================================
# docker-compose.yml — Entorno de desarrollo LOCAL completo
# Innovatech Chile — frontend + back-ventas + back-despachos + MySQL
#
# Uso: docker compose up --build
# Requiere: Docker + Docker Compose v2, correr desde la raíz del repo
# (donde están las carpetas back-Ventas_SpringBoot/, back-Despachos_SpringBoot/,
# front_despacho/ y este archivo)
# ============================================================

services:

  # ─────────────────────────────────────────────────────────
  # BASE DE DATOS — MySQL 8.0
  # Se buildea una sola vez y persiste datos en un volumen nombrado,
  # así los datos sobreviven a un docker compose down/up.
  # ─────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: innovatech-mysql-local
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_local_dev}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - innovatech-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-root_local_dev}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ─────────────────────────────────────────────────────────
  # BACKEND — Ventas (Spring Boot :8080)
  # Se buildea localmente desde el Dockerfile del componente
  # (en vez de pull de ECR, ya que esto es para desarrollo local)
  # ─────────────────────────────────────────────────────────
  back-ventas:
    build:
      context: ./back-Ventas_SpringBoot/Springboot-API-REST
    container_name: back-ventas
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_ENDPOINT: mysql
      DB_PORT: 3306
      DB_NAME: ventas
      DB_USERNAME: ${DB_USERNAME:-appuser}
      DB_PASSWORD: ${DB_PASSWORD:-app_local_dev}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - innovatech-net

  # ─────────────────────────────────────────────────────────
  # BACKEND — Despachos (Spring Boot :8081)
  # ─────────────────────────────────────────────────────────
  back-despachos:
    build:
      context: ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
    container_name: back-despachos
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      DB_ENDPOINT: mysql
      DB_PORT: 3306
      DB_NAME: despachos
      DB_USERNAME: ${DB_USERNAME:-appuser}
      DB_PASSWORD: ${DB_PASSWORD:-app_local_dev}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - innovatech-net

  # ─────────────────────────────────────────────────────────
  # FRONTEND — React/Vite servido por Nginx (:80)
  # NOTA: nginx.conf en producción apunta al DNS del ALB interno.
  # Para desarrollo local se sobreescribe con nginx.local.conf,
  # que apunta a los nombres de servicio de Compose (back-ventas,
  # back-despachos) en vez del ALB — ver Sección "Limitación conocida"
  # ─────────────────────────────────────────────────────────
  front-despacho:
    build:
      context: ./front_despacho
      args:
        VITE_API_BASE_URL: http://localhost
    container_name: front-despacho
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - back-ventas
      - back-despachos
    networks:
      - innovatech-net

networks:
  innovatech-net:
    driver: bridge

volumes:
  mysql-data:
