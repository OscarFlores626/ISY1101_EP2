name: CI/CD — Innovatech Chile ET

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      reason:
        description: 'Motivo del redeploy'
        required: false
        default: 'Redeploy manual'

      service:
        description: 'Servicio a redesplegar'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - back-ventas
          - back-despachos
          - front-despacho

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  IMAGE_TAG: ${{ github.sha }}

jobs:

  # =========================================================
  # BUILD — back-ventas
  # =========================================================
  build-back-ventas:
    name: Build & Push — back-ventas
    runs-on: ubuntu-latest

    if: >
      github.event_name == 'push' ||
      github.event.inputs.service == 'all' ||
      github.event.inputs.service == 'back-ventas'

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      # Etapa de test — corre antes del build de la imagen Docker,
      # asi el pipeline falla temprano si hay un test roto y no
      # se gasta tiempo construyendo una imagen sobre codigo defectuoso.
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - name: Ejecutar tests — back-ventas
        working-directory: back-Ventas_SpringBoot/Springboot-API-REST
        run: mvn test -B -Dspring.profiles.active=test

      - name: Configurar AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Crear repo ECR si no existe
        run: |
          aws ecr describe-repositories \
            --repository-names innovatech/back-ventas \
            --region $AWS_REGION 2>/dev/null || \
          aws ecr create-repository \
            --repository-name innovatech/back-ventas \
            --region $AWS_REGION

      - name: Build y Push
        working-directory: back-Ventas_SpringBoot/Springboot-API-REST
        run: |
          docker build \
            -t $ECR_REGISTRY/innovatech/back-ventas:$IMAGE_TAG \
            -t $ECR_REGISTRY/innovatech/back-ventas:latest \
            .

          docker push $ECR_REGISTRY/innovatech/back-ventas:$IMAGE_TAG
          docker push $ECR_REGISTRY/innovatech/back-ventas:latest

  # =========================================================
  # BUILD — back-despachos
  # =========================================================
  build-back-despachos:
    name: Build & Push — back-despachos
    runs-on: ubuntu-latest

    if: >
      github.event_name == 'push' ||
      github.event.inputs.service == 'all' ||
      github.event.inputs.service == 'back-despachos'

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - name: Ejecutar tests — back-despachos
        working-directory: back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
        run: mvn test -B -Dspring.profiles.active=test

      - name: Configurar AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Crear repo ECR si no existe
        run: |
          aws ecr describe-repositories \
            --repository-names innovatech/back-despachos \
            --region $AWS_REGION 2>/dev/null || \
          aws ecr create-repository \
            --repository-name innovatech/back-despachos \
            --region $AWS_REGION

      - name: Build y Push
        working-directory: back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
        run: |
          docker build \
            -t $ECR_REGISTRY/innovatech/back-despachos:$IMAGE_TAG \
            -t $ECR_REGISTRY/innovatech/back-despachos:latest \
            .

          docker push $ECR_REGISTRY/innovatech/back-despachos:$IMAGE_TAG
          docker push $ECR_REGISTRY/innovatech/back-despachos:latest

  # =========================================================
  # BUILD — front-despacho
  # =========================================================
  build-front-despacho:
    name: Build & Push — front-despacho
    runs-on: ubuntu-latest

    if: >
      github.event_name == 'push' ||
      github.event.inputs.service == 'all' ||
      github.event.inputs.service == 'front-despacho'

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      # Etapa de test — el proyecto no tiene tests unitarios configurados
      # (sin script "test" en package.json), asi que la validacion de
      # calidad de codigo es el lint estricto (max-warnings 0).
      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: front_despacho/package-lock.json

      - name: Instalar dependencias
        working-directory: front_despacho
        run: npm ci --frozen-lockfile

      - name: Lint — front-despacho
        working-directory: front_despacho
        run: npm run lint

      - name: Configurar AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Crear repo ECR si no existe
        run: |
          aws ecr describe-repositories \
            --repository-names innovatech/front-despacho \
            --region $AWS_REGION 2>/dev/null || \
          aws ecr create-repository \
            --repository-name innovatech/front-despacho \
            --region $AWS_REGION

      - name: Build y Push
        working-directory: front_despacho
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=${{ vars.FRONTEND_API_BASE_URL }} \
            -t $ECR_REGISTRY/innovatech/front-despacho:$IMAGE_TAG \
            -t $ECR_REGISTRY/innovatech/front-despacho:latest \
            .

          docker push $ECR_REGISTRY/innovatech/front-despacho:$IMAGE_TAG
          docker push $ECR_REGISTRY/innovatech/front-despacho:latest

  # =========================================================
  # DEPLOY — BACKEND via ECS Fargate
  # =========================================================
  deploy-backend:
    name: Deploy — ECS Backend
    runs-on: ubuntu-latest

    needs:
      - build-back-ventas
      - build-back-despachos

    if: always() &&
      needs.build-back-ventas.result == 'success' &&
      needs.build-back-despachos.result == 'success'

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy backend via ECS
        run: |
          aws ecs update-service \
            --cluster innovatech-cluster \
            --service innovatech-back-ventas-svc \
            --task-definition innovatech-back-ventas \
            --force-new-deployment \
            --region $AWS_REGION

          aws ecs update-service \
            --cluster innovatech-cluster \
            --service innovatech-back-despachos-svc \
            --task-definition innovatech-back-despachos \
            --force-new-deployment \
            --region $AWS_REGION

          aws ecs wait services-stable \
            --cluster innovatech-cluster \
            --services innovatech-back-ventas-svc innovatech-back-despachos-svc \
            --region $AWS_REGION

          echo "Backend desplegado correctamente en ECS Fargate"

  # =========================================================
  # DEPLOY — FRONTEND via ECS Fargate
  # =========================================================
  deploy-frontend:
    name: Deploy — ECS Frontend
    runs-on: ubuntu-latest

    needs:
      - build-front-despacho
      - deploy-backend

    if: always() &&
      needs.build-front-despacho.result == 'success' &&
      needs.deploy-backend.result == 'success'

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy frontend via ECS
        run: |
          aws ecs update-service \
            --cluster innovatech-cluster \
            --service innovatech-front-despacho-svc \
            --task-definition innovatech-front-despacho \
            --force-new-deployment \
            --region $AWS_REGION

          aws ecs wait services-stable \
            --cluster innovatech-cluster \
            --services innovatech-front-despacho-svc \
            --region $AWS_REGION

          echo "Deploy completado"
